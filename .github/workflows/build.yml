name: Build susubuddy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # arm64 runner — builds both arm64 and x64
            target: mac
            artifact: susubuddy-mac
          - os: windows-latest
            target: win
            artifact: susubuddy-win

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pip Pillow

      - name: Regenerate icons
        working-directory: app/build
        run: python make_icon.py

      - name: Install npm deps
        working-directory: app
        run: npm install

      - name: Build mac
        if: matrix.target == 'mac'
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac

      - name: Build win
        if: matrix.target == 'win'
        working-directory: app
        run: npm run dist

      - name: List dist
        shell: bash
        run: ls -lh app/dist/ || dir app/dist || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*Setup*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Attach to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*Setup*.exe
          fail_on_unmatched_files: false
