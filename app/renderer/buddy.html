<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self';">
<title>susubuddy</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    width: 100%; height: 100%;
    overflow: hidden;
    cursor: default;
    -webkit-user-select: none;
    user-select: none;
  }
  #root { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  @keyframes mochi-breathe {
    0%, 100% { transform: scaleX(1) scaleY(1); }
    50% { transform: scaleX(1.03) scaleY(0.97); }
  }
  @keyframes mochi-bounce {
    0%, 100% { transform: translateY(0) scaleX(1) scaleY(1); }
    30% { transform: translateY(-6px) scaleX(0.96) scaleY(1.04); }
    60% { transform: translateY(0) scaleX(1.05) scaleY(0.95); }
  }
  .buddy-wrap {
    cursor: grab;
    transition: transform .15s ease;
  }
  .buddy-wrap:hover { transform: scale(1.05); }
  .buddy-wrap:active { cursor: grabbing; }
</style>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>
<script type="text/babel" src="components.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
function BuddyApp() {
  const [mood, setMood] = React.useState('idle');
  const dragging = React.useRef(null);

  const onMouseDown = (e) => {
    if (e.button !== 0) return;
    dragging.current = { x: e.screenX, y: e.screenY, moved: false };
    setMood('focused');
  };
  const onMouseMove = (e) => {
    if (!dragging.current) return;
    const dx = e.screenX - dragging.current.x;
    const dy = e.screenY - dragging.current.y;
    if (dx || dy) dragging.current.moved = true;
    window.susu.dragMove(dx, dy);
    dragging.current.x = e.screenX;
    dragging.current.y = e.screenY;
  };
  const onMouseUp = (e) => {
    if (!dragging.current) return;
    const wasClick = !dragging.current.moved;
    dragging.current = null;
    setMood('idle');
    if (wasClick && e.button === 0) window.susu.openMenu();
  };
  const onContextMenu = (e) => { e.preventDefault(); window.susu.openMenu(); };
  const onDoubleClick = () => window.susu.openMenu();
  const onMouseEnter = () => { if (!dragging.current) setMood('happy'); };
  const onMouseLeave = () => { if (!dragging.current) setMood('idle'); };

  React.useEffect(() => {
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseup', onMouseUp);
    return () => {
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('mouseup', onMouseUp);
    };
  }, []);

  return (
    <div
      className="buddy-wrap"
      onMouseDown={onMouseDown}
      onMouseEnter={onMouseEnter}
      onMouseLeave={onMouseLeave}
      onContextMenu={onContextMenu}
      onDoubleClick={onDoubleClick}
      style={{ pointerEvents: 'auto' }}
    >
      <Mochi mood={mood} size={120} palette="lilac" />
    </div>
  );
}

// wait for components.jsx to be parsed by Babel before mounting
const waitForComponents = setInterval(() => {
  if (typeof Mochi !== 'undefined') {
    clearInterval(waitForComponents);
    ReactDOM.createRoot(document.getElementById('root')).render(<BuddyApp />);
  }
}, 30);
</script>
</body>
</html>
