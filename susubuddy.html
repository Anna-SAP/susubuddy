<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>susubuddy — design exploration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  body { font-family: 'Nunito', -apple-system, system-ui, sans-serif; color: #3A2A24; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
// ─────────────────────────────────────────────────────────────
// DesignCanvas — Figma-ish pan/zoom wrapper with sections + artboards
// ─────────────────────────────────────────────────────────────
const DC = {
  bg: '#f0eee9',
  grid: 'rgba(0,0,0,0.06)',
  label: 'rgba(60,50,40,0.7)',
  title: 'rgba(40,30,20,0.85)',
  subtitle: 'rgba(60,50,40,0.6)',
  postitBg: '#fef4a8',
  postitText: '#5a4a2a',
  font: '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif',
};

if (typeof document !== 'undefined' && !document.getElementById('dc-styles')) {
  const s = document.createElement('style');
  s.id = 'dc-styles';
  s.textContent = [
    '.dc-editable{cursor:text;outline:none;white-space:nowrap;border-radius:3px;padding:0 2px;margin:0 -2px}',
    '.dc-editable:focus{background:#fff;box-shadow:0 0 0 1.5px #c96442}',
    '[data-dc-slot]{transition:transform .18s cubic-bezier(.2,.7,.3,1)}',
    '[data-dc-slot].dc-dragging{transition:none;z-index:10;pointer-events:none}',
    '[data-dc-slot].dc-dragging .dc-card{box-shadow:0 12px 40px rgba(0,0,0,.25),0 0 0 2px #c96442;transform:scale(1.02)}',
    '.dc-card{transition:box-shadow .15s,transform .15s}',
    '.dc-card *{scrollbar-width:none}',
    '.dc-card *::-webkit-scrollbar{display:none}',
    '.dc-labelrow{display:flex;align-items:center;gap:4px;height:24px}',
    '.dc-grip{cursor:grab;display:flex;align-items:center;padding:5px 4px;border-radius:4px;transition:background .12s}',
    '.dc-grip:hover{background:rgba(0,0,0,.08)}',
    '.dc-grip:active{cursor:grabbing}',
    '.dc-labeltext{cursor:pointer;border-radius:4px;padding:3px 6px;display:flex;align-items:center;transition:background .12s}',
    '.dc-labeltext:hover{background:rgba(0,0,0,.05)}',
    '.dc-expand{position:absolute;bottom:100%;right:0;margin-bottom:5px;z-index:2;opacity:0;transition:opacity .12s,background .12s;',
    '  width:22px;height:22px;border-radius:5px;border:none;cursor:pointer;padding:0;',
    '  background:transparent;color:rgba(60,50,40,.7);display:flex;align-items:center;justify-content:center}',
    '.dc-expand:hover{background:rgba(0,0,0,.06);color:#2a251f}',
    '[data-dc-slot]:hover .dc-expand{opacity:1}',
  ].join('\n');
  document.head.appendChild(s);
}

const DCCtx = React.createContext(null);

function DesignCanvas({ children, minScale, maxScale, style }) {
  const [state, setState] = React.useState({ sections: {}, focus: null });

  // Build registries synchronously from children
  const registry = {};
  const sectionMeta = {};
  const sectionOrder = [];
  React.Children.forEach(children, (sec) => {
    if (!sec || sec.type !== DCSection) return;
    const sid = sec.props.id ?? sec.props.title;
    if (!sid) return;
    sectionOrder.push(sid);
    const persisted = state.sections[sid] || {};
    const srcIds = [];
    React.Children.forEach(sec.props.children, (ab) => {
      if (!ab || ab.type !== DCArtboard) return;
      const aid = ab.props.id ?? ab.props.label;
      if (!aid) return;
      registry[`${sid}/${aid}`] = { sectionId: sid, artboard: ab };
      srcIds.push(aid);
    });
    const kept = (persisted.order || []).filter((k) => srcIds.includes(k));
    sectionMeta[sid] = {
      title: persisted.title ?? sec.props.title,
      subtitle: sec.props.subtitle,
      slotIds: [...kept, ...srcIds.filter((k) => !kept.includes(k))],
    };
  });

  const api = React.useMemo(() => ({
    state,
    section: (id) => state.sections[id] || {},
    patchSection: (id, p) => setState((s) => ({
      ...s,
      sections: { ...s.sections, [id]: { ...s.sections[id], ...(typeof p === 'function' ? p(s.sections[id] || {}) : p) } },
    })),
    setFocus: (slotId) => setState((s) => ({ ...s, focus: slotId })),
  }), [state]);

  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') api.setFocus(null); };
    const onPd = (e) => {
      const ae = document.activeElement;
      if (ae && ae.isContentEditable && !ae.contains(e.target)) ae.blur();
    };
    document.addEventListener('keydown', onKey);
    document.addEventListener('pointerdown', onPd, true);
    return () => {
      document.removeEventListener('keydown', onKey);
      document.removeEventListener('pointerdown', onPd, true);
    };
  }, [api]);

  return (
    <DCCtx.Provider value={api}>
      <DCViewport minScale={minScale} maxScale={maxScale} style={style}>{children}</DCViewport>
      {state.focus && registry[state.focus] && (
        <DCFocusOverlay entry={registry[state.focus]} sectionMeta={sectionMeta} sectionOrder={sectionOrder} />
      )}
    </DCCtx.Provider>
  );
}

function DCViewport({ children, minScale = 0.1, maxScale = 8, style = {} }) {
  const vpRef = React.useRef(null);
  const worldRef = React.useRef(null);
  const tf = React.useRef({ x: 0, y: 0, scale: 1 });

  const apply = React.useCallback(() => {
    const { x, y, scale } = tf.current;
    const el = worldRef.current;
    if (el) el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;
  }, []);

  React.useEffect(() => {
    const vp = vpRef.current;
    if (!vp) return;

    const zoomAt = (cx, cy, factor) => {
      const r = vp.getBoundingClientRect();
      const px = cx - r.left, py = cy - r.top;
      const t = tf.current;
      const next = Math.min(maxScale, Math.max(minScale, t.scale * factor));
      const k = next / t.scale;
      t.x = px - (px - t.x) * k;
      t.y = py - (py - t.y) * k;
      t.scale = next;
      apply();
    };

    const isMouseWheel = (e) =>
      e.deltaMode !== 0 ||
      (e.deltaX === 0 && Number.isInteger(e.deltaY) && Math.abs(e.deltaY) >= 40);

    const onWheel = (e) => {
      e.preventDefault();
      if (isGesturing) return;
      if (e.ctrlKey) {
        zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
      } else if (isMouseWheel(e)) {
        zoomAt(e.clientX, e.clientY, Math.exp(-Math.sign(e.deltaY) * 0.18));
      } else {
        tf.current.x -= e.deltaX;
        tf.current.y -= e.deltaY;
        apply();
      }
    };

    let gsBase = 1;
    let isGesturing = false;
    const onGestureStart = (e) => { e.preventDefault(); isGesturing = true; gsBase = tf.current.scale; };
    const onGestureChange = (e) => {
      e.preventDefault();
      zoomAt(e.clientX, e.clientY, (gsBase * e.scale) / tf.current.scale);
    };
    const onGestureEnd = (e) => { e.preventDefault(); isGesturing = false; };

    let drag = null;
    const onPointerDown = (e) => {
      const onBg = !e.target.closest('[data-dc-slot], .dc-editable');
      if (!(e.button === 1 || (e.button === 0 && onBg))) return;
      e.preventDefault();
      vp.setPointerCapture(e.pointerId);
      drag = { id: e.pointerId, lx: e.clientX, ly: e.clientY };
      vp.style.cursor = 'grabbing';
    };
    const onPointerMove = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      tf.current.x += e.clientX - drag.lx;
      tf.current.y += e.clientY - drag.ly;
      drag.lx = e.clientX; drag.ly = e.clientY;
      apply();
    };
    const onPointerUp = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      vp.releasePointerCapture(e.pointerId);
      drag = null;
      vp.style.cursor = '';
    };

    vp.addEventListener('wheel', onWheel, { passive: false });
    vp.addEventListener('gesturestart', onGestureStart, { passive: false });
    vp.addEventListener('gesturechange', onGestureChange, { passive: false });
    vp.addEventListener('gestureend', onGestureEnd, { passive: false });
    vp.addEventListener('pointerdown', onPointerDown);
    vp.addEventListener('pointermove', onPointerMove);
    vp.addEventListener('pointerup', onPointerUp);
    vp.addEventListener('pointercancel', onPointerUp);
    return () => {
      vp.removeEventListener('wheel', onWheel);
      vp.removeEventListener('gesturestart', onGestureStart);
      vp.removeEventListener('gesturechange', onGestureChange);
      vp.removeEventListener('gestureend', onGestureEnd);
      vp.removeEventListener('pointerdown', onPointerDown);
      vp.removeEventListener('pointermove', onPointerMove);
      vp.removeEventListener('pointerup', onPointerUp);
      vp.removeEventListener('pointercancel', onPointerUp);
    };
  }, [apply, minScale, maxScale]);

  const gridSvg = `url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M120 0H0v120' fill='none' stroke='${encodeURIComponent(DC.grid)}' stroke-width='1'/%3E%3C/svg%3E")`;
  return (
    <div
      ref={vpRef}
      className="design-canvas"
      style={{
        height: '100vh', width: '100vw',
        background: DC.bg,
        overflow: 'hidden',
        overscrollBehavior: 'none',
        touchAction: 'none',
        position: 'relative',
        fontFamily: DC.font,
        boxSizing: 'border-box',
        ...style,
      }}
    >
      <div
        ref={worldRef}
        style={{
          position: 'absolute', top: 0, left: 0,
          transformOrigin: '0 0',
          willChange: 'transform',
          width: 'max-content', minWidth: '100%',
          minHeight: '100%',
          padding: '60px 0 80px',
        }}
      >
        <div style={{ position: 'absolute', inset: -6000, backgroundImage: gridSvg, backgroundSize: '120px 120px', pointerEvents: 'none', zIndex: -1 }} />
        {children}
      </div>
    </div>
  );
}

function DCSection({ id, title, subtitle, children, gap = 48 }) {
  const ctx = React.useContext(DCCtx);
  const sid = id ?? title;
  const all = React.Children.toArray(children);
  const artboards = all.filter((c) => c && c.type === DCArtboard);
  const rest = all.filter((c) => !(c && c.type === DCArtboard));
  const srcOrder = artboards.map((a) => a.props.id ?? a.props.label);
  const sec = (ctx && sid && ctx.section(sid)) || {};

  const order = React.useMemo(() => {
    const kept = (sec.order || []).filter((k) => srcOrder.includes(k));
    return [...kept, ...srcOrder.filter((k) => !kept.includes(k))];
  }, [sec.order, srcOrder.join('|')]);

  const byId = Object.fromEntries(artboards.map((a) => [a.props.id ?? a.props.label, a]));

  return (
    <div data-dc-section={sid} style={{ marginBottom: 80, position: 'relative' }}>
      <div style={{ padding: '0 60px 56px' }}>
        <DCEditable tag="div" value={sec.title ?? title}
          onChange={(v) => ctx && sid && ctx.patchSection(sid, { title: v })}
          style={{ fontSize: 28, fontWeight: 600, color: DC.title, letterSpacing: -0.4, marginBottom: 6, display: 'inline-block' }} />
        {subtitle && <div style={{ fontSize: 16, color: DC.subtitle }}>{subtitle}</div>}
      </div>
      <div style={{ display: 'flex', gap, padding: '0 60px', alignItems: 'flex-start', width: 'max-content' }}>
        {order.map((k) => (
          <DCArtboardFrame key={k} sectionId={sid} artboard={byId[k]} order={order}
            label={(sec.labels || {})[k] ?? byId[k].props.label}
            onRename={(v) => ctx && ctx.patchSection(sid, (x) => ({ labels: { ...x.labels, [k]: v } }))}
            onReorder={(next) => ctx && ctx.patchSection(sid, { order: next })}
            onFocus={() => ctx && ctx.setFocus(`${sid}/${k}`)} />
        ))}
      </div>
      {rest}
    </div>
  );
}

function DCArtboard() { return null; }

function DCArtboardFrame({ sectionId, artboard, label, order, onRename, onReorder, onFocus }) {
  const { id: rawId, label: rawLabel, width = 260, height = 480, children, style = {} } = artboard.props;
  const id = rawId ?? rawLabel;
  const ref = React.useRef(null);

  const onGripDown = (e) => {
    e.preventDefault(); e.stopPropagation();
    const me = ref.current;
    const scale = me.getBoundingClientRect().width / me.offsetWidth || 1;
    const peers = Array.from(document.querySelectorAll(`[data-dc-section="${sectionId}"] [data-dc-slot]`));
    const homes = peers.map((el) => ({ el, id: el.dataset.dcSlot, x: el.getBoundingClientRect().left }));
    const slotXs = homes.map((h) => h.x);
    const startIdx = order.indexOf(id);
    const startX = e.clientX;
    let liveOrder = order.slice();
    me.classList.add('dc-dragging');

    const layout = () => {
      for (const h of homes) {
        if (h.id === id) continue;
        const slot = liveOrder.indexOf(h.id);
        h.el.style.transform = `translateX(${(slotXs[slot] - h.x) / scale}px)`;
      }
    };

    const move = (ev) => {
      const dx = ev.clientX - startX;
      me.style.transform = `translateX(${dx / scale}px)`;
      const cur = homes[startIdx].x + dx;
      let nearest = 0, best = Infinity;
      for (let i = 0; i < slotXs.length; i++) {
        const d = Math.abs(slotXs[i] - cur);
        if (d < best) { best = d; nearest = i; }
      }
      if (liveOrder.indexOf(id) !== nearest) {
        liveOrder = order.filter((k) => k !== id);
        liveOrder.splice(nearest, 0, id);
        layout();
      }
    };

    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      const finalSlot = liveOrder.indexOf(id);
      me.classList.remove('dc-dragging');
      me.style.transform = `translateX(${(slotXs[finalSlot] - homes[startIdx].x) / scale}px)`;
      setTimeout(() => {
        for (const h of homes) { h.el.style.transition = 'none'; h.el.style.transform = ''; }
        if (liveOrder.join('|') !== order.join('|')) onReorder(liveOrder);
        requestAnimationFrame(() => requestAnimationFrame(() => {
          for (const h of homes) h.el.style.transition = '';
        }));
      }, 180);
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  };

  return (
    <div ref={ref} data-dc-slot={id} style={{ position: 'relative', flexShrink: 0 }}>
      <div className="dc-labelrow" style={{ position: 'absolute', bottom: '100%', left: -4, marginBottom: 4, color: DC.label }}>
        <div className="dc-grip" onPointerDown={onGripDown} title="Drag to reorder">
          <svg width="9" height="13" viewBox="0 0 9 13" fill="currentColor"><circle cx="2" cy="2" r="1.1"/><circle cx="7" cy="2" r="1.1"/><circle cx="2" cy="6.5" r="1.1"/><circle cx="7" cy="6.5" r="1.1"/><circle cx="2" cy="11" r="1.1"/><circle cx="7" cy="11" r="1.1"/></svg>
        </div>
        <div className="dc-labeltext" onClick={onFocus} title="Click to focus">
          <DCEditable value={label} onChange={onRename} onClick={(e) => e.stopPropagation()}
            style={{ fontSize: 15, fontWeight: 500, color: DC.label, lineHeight: 1 }} />
        </div>
      </div>
      <button className="dc-expand" onClick={onFocus} onPointerDown={(e) => e.stopPropagation()} title="Focus">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M7 1h4v4M5 11H1V7M11 1L7.5 4.5M1 11l3.5-3.5"/></svg>
      </button>
      <div className="dc-card"
        style={{ borderRadius: 2, boxShadow: '0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06)', overflow: 'hidden', width, height, background: '#fff', ...style }}>
        {children || <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#bbb', fontSize: 13, fontFamily: DC.font }}>{id}</div>}
      </div>
    </div>
  );
}

function DCEditable({ value, onChange, style, tag = 'span', onClick }) {
  const T = tag;
  return (
    <T className="dc-editable" contentEditable suppressContentEditableWarning
      onClick={onClick}
      onPointerDown={(e) => e.stopPropagation()}
      onBlur={(e) => onChange && onChange(e.currentTarget.textContent)}
      onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); } }}
      style={style}>{value}</T>
  );
}

function DCFocusOverlay({ entry, sectionMeta, sectionOrder }) {
  const ctx = React.useContext(DCCtx);
  const { sectionId, artboard } = entry;
  const sec = ctx.section(sectionId);
  const meta = sectionMeta[sectionId];
  const peers = meta.slotIds;
  const aid = artboard.props.id ?? artboard.props.label;
  const idx = peers.indexOf(aid);
  const secIdx = sectionOrder.indexOf(sectionId);

  const go = (d) => { const n = peers[(idx + d + peers.length) % peers.length]; if (n) ctx.setFocus(`${sectionId}/${n}`); };
  const goSection = (d) => {
    const ns = sectionOrder[(secIdx + d + sectionOrder.length) % sectionOrder.length];
    const first = sectionMeta[ns] && sectionMeta[ns].slotIds[0];
    if (first) ctx.setFocus(`${ns}/${first}`);
  };

  React.useEffect(() => {
    const k = (e) => {
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
      if (e.key === 'ArrowUp') { e.preventDefault(); goSection(-1); }
      if (e.key === 'ArrowDown') { e.preventDefault(); goSection(1); }
    };
    document.addEventListener('keydown', k);
    return () => document.removeEventListener('keydown', k);
  });

  const { width = 260, height = 480, children } = artboard.props;
  const [vp, setVp] = React.useState({ w: window.innerWidth, h: window.innerHeight });
  React.useEffect(() => { const r = () => setVp({ w: window.innerWidth, h: window.innerHeight }); window.addEventListener('resize', r); return () => window.removeEventListener('resize', r); }, []);
  const scale = Math.max(0.1, Math.min((vp.w - 200) / width, (vp.h - 260) / height, 2));

  const [ddOpen, setDd] = React.useState(false);
  const Arrow = ({ dir, onClick }) => (
    <button onClick={(e) => { e.stopPropagation(); onClick(); }}
      style={{ position: 'absolute', top: '50%', [dir]: 28, transform: 'translateY(-50%)',
        border: 'none', background: 'rgba(255,255,255,.08)', color: 'rgba(255,255,255,.9)',
        width: 44, height: 44, borderRadius: 22, fontSize: 18, cursor: 'pointer',
        display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'background .15s' }}
      onMouseEnter={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.18)')}
      onMouseLeave={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.08)')}>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
        <path d={dir === 'left' ? 'M11 3L5 9l6 6' : 'M7 3l6 6-6 6'} /></svg>
    </button>
  );

  return ReactDOM.createPortal(
    <div onClick={() => ctx.setFocus(null)}
      onWheel={(e) => e.preventDefault()}
      style={{ position: 'fixed', inset: 0, zIndex: 100, background: 'rgba(24,20,16,.6)', backdropFilter: 'blur(14px)',
        fontFamily: DC.font, color: '#fff' }}>

      <div onClick={(e) => e.stopPropagation()}
        style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 72, display: 'flex', alignItems: 'flex-start', padding: '16px 20px 0', gap: 16 }}>
        <div style={{ position: 'relative' }}>
          <button onClick={() => setDd((o) => !o)}
            style={{ border: 'none', background: 'transparent', color: '#fff', cursor: 'pointer', padding: '6px 8px',
              borderRadius: 6, textAlign: 'left', fontFamily: 'inherit' }}>
            <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: 18, fontWeight: 600, letterSpacing: -0.3 }}>{meta.title}</span>
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" style={{ opacity: .7 }}><path d="M2 4l3.5 3.5L9 4"/></svg>
            </span>
            {meta.subtitle && <span style={{ display: 'block', fontSize: 13, opacity: .6, fontWeight: 400, marginTop: 2 }}>{meta.subtitle}</span>}
          </button>
          {ddOpen && (
            <div style={{ position: 'absolute', top: '100%', left: 0, marginTop: 4, background: '#2a251f', borderRadius: 8,
              boxShadow: '0 8px 32px rgba(0,0,0,.4)', padding: 4, minWidth: 200, zIndex: 10 }}>
              {sectionOrder.map((sid) => (
                <button key={sid} onClick={() => { setDd(false); const f = sectionMeta[sid].slotIds[0]; if (f) ctx.setFocus(`${sid}/${f}`); }}
                  style={{ display: 'block', width: '100%', textAlign: 'left', border: 'none', cursor: 'pointer',
                    background: sid === sectionId ? 'rgba(255,255,255,.1)' : 'transparent', color: '#fff',
                    padding: '8px 12px', borderRadius: 5, fontSize: 14, fontWeight: sid === sectionId ? 600 : 400, fontFamily: 'inherit' }}>
                  {sectionMeta[sid].title}
                </button>
              ))}
            </div>
          )}
        </div>
        <div style={{ flex: 1 }} />
        <button onClick={() => ctx.setFocus(null)}
          onMouseEnter={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.12)')}
          onMouseLeave={(e) => (e.currentTarget.style.background = 'transparent')}
          style={{ border: 'none', background: 'transparent', color: 'rgba(255,255,255,.7)', width: 32, height: 32,
            borderRadius: 16, fontSize: 20, cursor: 'pointer', lineHeight: 1, transition: 'background .12s' }}>×</button>
      </div>

      <div
        style={{ position: 'absolute', top: 64, bottom: 56, left: 100, right: 100, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 16 }}>
        <div onClick={(e) => e.stopPropagation()} style={{ width: width * scale, height: height * scale, position: 'relative' }}>
          <div style={{ width, height, transform: `scale(${scale})`, transformOrigin: 'top left', background: '#fff', borderRadius: 2, overflow: 'hidden',
            boxShadow: '0 20px 80px rgba(0,0,0,.4)' }}>
            {children || <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#bbb' }}>{aid}</div>}
          </div>
        </div>
        <div onClick={(e) => e.stopPropagation()} style={{ fontSize: 14, fontWeight: 500, opacity: .85, textAlign: 'center' }}>
          {(sec.labels || {})[aid] ?? artboard.props.label}
          <span style={{ opacity: .5, marginLeft: 10, fontVariantNumeric: 'tabular-nums' }}>{idx + 1} / {peers.length}</span>
        </div>
      </div>

      <Arrow dir="left" onClick={() => go(-1)} />
      <Arrow dir="right" onClick={() => go(1)} />

      <div onClick={(e) => e.stopPropagation()}
        style={{ position: 'absolute', bottom: 20, left: '50%', transform: 'translateX(-50%)', display: 'flex', gap: 8 }}>
        {peers.map((p, i) => (
          <button key={p} onClick={() => ctx.setFocus(`${sectionId}/${p}`)}
            style={{ border: 'none', padding: 0, cursor: 'pointer', width: 6, height: 6, borderRadius: 3,
              background: i === idx ? '#fff' : 'rgba(255,255,255,.3)' }} />
        ))}
      </div>
    </div>,
    document.body,
  );
}

const MOCHI_PALETTES = {
  peach: {
    body: '#FFD8B5', bodyDeep: '#F5B98E', highlight: '#FFEBD4',
    shadow: 'rgba(232, 145, 107, 0.28)',
    cheek: '#FFB0A8', eye: '#3A2A24', mouth: '#6B3F32',

  },
  pink: {
    body: '#FFC6D3', bodyDeep: '#F49CB0', highlight: '#FFE1E8',

    cheek: '#FF9AAA', eye: '#3A2028', mouth: '#6B2F3A',
    sparkle: '#FFD6E2',
  },
  cream: {
    body: '#FDEBCE', bodyDeep: '#E8C79B', highlight: '#FFF6E2',
    shadow: 'rgba(180, 140, 90, 0.24)',
    cheek: '#FFB894', eye: '#3A2E22', mouth: '#6B4A2F',
    sparkle: '#FFE08A',

    shadow: 'rgba(150, 120, 190, 0.25)',
    cheek: '#E4A6C5', eye: '#2E2438', mouth: '#5A3F5E',
    sparkle: '#F3DCF5',
  },
};

function MochiEye({ cx, cy, rx = 9, ry = 11, mood, palette }) {
  const closed = mood === 'blink' || mood === 'sleepy' || mood === 'celebrating';
  const happy = mood === 'happy' || mood === 'excited' || mood === 'celebrating';
  const narrowed = mood === 'grumpy' || mood === 'focused';

  if (happy) {
    return (
      <path d={`M ${cx - rx} ${cy + 1} Q ${cx} ${cy - ry} ${cx + rx} ${cy + 1}`}
        stroke={palette.eye} strokeWidth="2.6" strokeLinecap="round" fill="none" />
    );
  }
  if (closed) {
    return (
      <path d={`M ${cx - rx + 1} ${cy} Q ${cx} ${cy + 3} ${cx + rx - 1} ${cy}`}
        stroke={palette.eye} strokeWidth="2.6" strokeLinecap="round" fill="none" />
    );
  }
  if (narrowed) {
    return (
      <g>
        <ellipse cx={cx} cy={cy} rx={rx} ry={ry * 0.55} fill={palette.eye} />
        <circle cx={cx + 2} cy={cy - 2} r="2" fill="#fff" />
      </g>
    );
  }
  return (
    <g>
      <ellipse cx={cx} cy={cy} rx={rx} ry={ry} fill={palette.eye} />
      <circle cx={cx + 3} cy={cy - 3.5} r="3" fill="#fff" />
      <circle cx={cx - 2.5} cy={cy + 3} r="1.2" fill="#fff" opacity="0.75" />
    </g>
  );
}

function MochiMouth({ cx, cy, mood, palette }) {
  if (mood === 'happy' || mood === 'giggle') {
    return <path d={`M ${cx - 8} ${cy} Q ${cx} ${cy + 8} ${cx + 8} ${cy}`}
      stroke={palette.mouth} strokeWidth="2.2" strokeLinecap="round" fill="none" />;
  }
  if (mood === 'excited') {
    return <ellipse cx={cx} cy={cy + 2} rx="6" ry="7" fill={palette.mouth} />;
  }
  if (mood === 'celebrating') {
    return (
      <g>
        <path d={`M ${cx - 9} ${cy - 1} Q ${cx} ${cy + 9} ${cx + 9} ${cy - 1} Z`} fill={palette.mouth} />
        <path d={`M ${cx - 7} ${cy + 1} Q ${cx} ${cy + 5} ${cx + 7} ${cy + 1}`} fill="#FF8FA8" />
      </g>
    );
  }
  if (mood === 'sleepy') {
    return <ellipse cx={cx} cy={cy + 1} rx="5" ry="3" fill={palette.mouth} opacity="0.8" />;
  }
  if (mood === 'grumpy') {
    return <path d={`M ${cx - 7} ${cy + 3} Q ${cx} ${cy - 3} ${cx + 7} ${cy + 3}`}
      stroke={palette.mouth} strokeWidth="2.2" strokeLinecap="round" fill="none" />;
  }
  if (mood === 'focused') {
    return <path d={`M ${cx - 5} ${cy + 1} L ${cx + 5} ${cy + 1}`}
      stroke={palette.mouth} strokeWidth="2.2" strokeLinecap="round" fill="none" />;
  }
  return <path d={`M ${cx - 5} ${cy} Q ${cx - 2.5} ${cy + 3} ${cx} ${cy} Q ${cx + 2.5} ${cy + 3} ${cx + 5} ${cy}`}
    stroke={palette.mouth} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none" />;
}

function Mochi({ mood = 'idle', size = 120, palette = 'peach', animated = true, className = '', style = {} }) {
  const pal = typeof palette === 'string' ? MOCHI_PALETTES[palette] : palette;
  const [realMood, setRealMood] = React.useState(mood);

  React.useEffect(() => {
    if (!animated || mood !== 'idle') { setRealMood(mood); return; }
    setRealMood('idle');
    let t;
    const loop = () => {
      const delay = 2800 + Math.random() * 2200;
      t = setTimeout(() => {
        setRealMood('blink');
        setTimeout(() => { setRealMood('idle'); loop(); }, 140);
      }, delay);
    };
    loop();
    return () => clearTimeout(t);
  }, [mood, animated]);

  const breathing = animated && (realMood === 'idle' || realMood === 'blink' || realMood === 'focused' || realMood === 'grumpy');
  const bouncing = animated && (realMood === 'excited' || realMood === 'celebrating' || realMood === 'happy');
  const sleeping = animated && realMood === 'sleepy';

  const wrapStyle = {
    width: size, height: size, position: 'relative',
    animation: bouncing ? 'mochi-bounce 0.9s ease-in-out infinite'
              : breathing ? 'mochi-breathe 3.4s ease-in-out infinite'
              : sleeping ? 'mochi-breathe 4.8s ease-in-out infinite'
              : 'none',
    transformOrigin: 'center bottom',
    ...style,
  };

  const cx = 70, cy = 74;
  const leftEye = 54, rightEye = 86, eyeY = 68;

  return (
    <div className={`mochi ${className}`} style={wrapStyle} data-mood={realMood}>
      <svg viewBox="0 0 140 140" width={size} height={size} style={{ display: 'block', overflow: 'visible' }}>
        <defs>
          <radialGradient id={`mg-${pal.body.replace('#','')}`} cx="40%" cy="35%" r="70%">
            <stop offset="0%" stopColor={pal.highlight} />
            <stop offset="55%" stopColor={pal.body} />
            <stop offset="100%" stopColor={pal.bodyDeep} />

          <filter id={`mfuzz-${pal.body.replace('#','')}`} x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="0.6" />
          </filter>
        </defs>

        <ellipse cx={cx} cy="128" rx="44" ry="5" fill={pal.shadow} />

        <g>
          <path
            d={`M ${cx} 22
               C 108 22, 124 48, 124 74
               C 124 104, 102 124, ${cx} 124
               C 38 124, 16 104, 16 74
               C 16 48, 32 22, ${cx} 22 Z`}
            fill={`url(#mg-${pal.body.replace('#','')})`}
            filter={`url(#mfuzz-${pal.body.replace('#','')})`}
          />
          <g stroke={pal.bodyDeep} strokeWidth="1.3" strokeLinecap="round" opacity="0.55">
            <line x1="70" y1="22" x2="70" y2="18" />
            <line x1="60" y1="23" x2="58" y2="19" />
            <line x1="80" y1="23" x2="82" y2="19" />
            <line x1="50" y1="26" x2="46" y2="23" />
            <line x1="90" y1="26" x2="94" y2="23" />
            <line x1="16" y1="70" x2="12" y2="70" />
            <line x1="18" y1="58" x2="14" y2="56" />
            <line x1="18" y1="82" x2="14" y2="84" />
            <line x1="124" y1="70" x2="128" y2="70" />
            <line x1="122" y1="58" x2="126" y2="56" />
            <line x1="122" y1="82" x2="126" y2="84" />
            <line x1="30" y1="108" x2="27" y2="112" />
            <line x1="110" y1="108" x2="113" y2="112" />
          </g>
          <ellipse cx="52" cy="46" rx="18" ry="10" fill="#fff" opacity="0.35" />
        </g>

        <ellipse cx={leftEye - 10} cy={eyeY + 10} rx="7" ry="4.5" fill={pal.cheek} opacity="0.85" />
        <ellipse cx={rightEye + 10} cy={eyeY + 10} rx="7" ry="4.5" fill={pal.cheek} opacity="0.85" />

        <MochiEye cx={leftEye} cy={eyeY} mood={realMood} palette={pal} />
        <MochiEye cx={rightEye} cy={eyeY} mood={realMood} palette={pal} />

        <MochiMouth cx={cx} cy={eyeY + 18} mood={realMood} palette={pal} />

        {realMood === 'sleepy' && (
          <g>
            <text x="108" y="38" fontFamily="'Nunito', sans-serif" fontSize="14" fontWeight="700" fill={pal.mouth} opacity="0.75">z</text>
            <text x="116" y="28" fontFamily="'Nunito', sans-serif" fontSize="18" fontWeight="700" fill={pal.mouth} opacity="0.55">Z</text>
            <text x="126" y="16" fontFamily="'Nunito', sans-serif" fontSize="22" fontWeight="700" fill={pal.mouth} opacity="0.35">Z</text>
          </g>
        )}
        {realMood === 'focused' && (
          <g>
            <circle cx="108" cy="44" r="10" fill="none" stroke={pal.mouth} strokeWidth="2.2" />

          </g>

          </g>
        )}
        {realMood === 'happy' && (
          <g>
            <circle cx="26" cy="46" r="1.8" fill={pal.sparkle} />

    if (state !== 'processing') return;
    setProgress(0);
    let p = 0;
    const t = setInterval(() => {
      p += 0.08 + Math.random() * 0.05;
      if (p >= 1) {

        setProgress(1);

          title: 'GlobalProtect — manual install',

        setTimeout(() => setState('done'), 350);

    }}>
      <DesktopBg />

      <GhostApp top={60} left={120} w={520} h={320} />
      <GhostApp top={130} right={160} w={480} h={300} tilt={-1} opacity={0.45} />
      <GhostApp bottom={120} left={280} w={600} h={260} tilt={0.5} opacity={0.35} />

      <FocusedBrowser width={width * 0.58} height={height * 0.66} top={90} left={(width - width*0.58)/2} dim={state === 'capturing'} />

      {state === 'capturing' && (
        <OCRMarquee x={(width - 560)/2 + 40} y={140} w={520} h={340} label="release to save" />
      )}

      <Taskbar />

      <div style={{
        position: 'absolute', right: 28, bottom: 58,
        display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 10,
        zIndex: 20,
      }}>

        {state === 'processing' && (
          <OCRProgress progress={progress}
            stage={progress < 0.35 ? 'framing the area…' : progress < 0.7 ? 'reading characters…' : 'tidying into markdown…'} />
        )}

        {state === 'done' && lastCapture && (
          <MarkdownCard
            title={lastCapture.title}
            lines={lastCapture.lines}
            sources={1}
            chars={lastCapture.chars}
            style={{ width: 360 }}
          />
        )}

        {state === 'inspiration' && (
          <InspirationPanel
            onClose={() => { setState('saved'); }}
            initialValue=""
            withTags
          />
        )}

        {state === 'saved' && (
          <div style={{
            background: SUSU.mint, color: '#2C5F3F',
            padding: '8px 14px', borderRadius: 14, fontSize: 12.5, fontWeight: 700,
            boxShadow: '0 4px 14px rgba(122, 185, 143, 0.35)',
          }}>saved to your archive 💭</div>
        )}

        {menuOpen && state === 'menu' && (
          <ActionMenu
            onCapture={() => { setMenuOpen(false); setState('capturing'); setTimeout(() => setState('processing'), 1600); }}
            onInspiration={() => { setMenuOpen(false); setState('inspiration'); }}
            onArchive={() => { setMenuOpen(false); setLibraryOpen(true); setState('idle'); }}
            onClose={() => { setMenuOpen(false); setState('idle'); }}
          />
        )}

        {(state === 'idle' || state === 'menu' || state === 'capturing') && !menuOpen && (
          <div style={{
            background: 'rgba(58, 42, 36, 0.85)', color: '#FFF',
            padding: '5px 11px', borderRadius: 12, fontSize: 11.5, fontWeight: 600,
            marginBottom: 4,
          }}>{s.label}</div>
        )}

        <div
          onClick={onBuddyClick}
          style={{
            cursor: 'pointer', position: 'relative',
            padding: 6, borderRadius: '50%',
            background: 'radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%)',
          }}
        >
          <Mochi mood={s.mood} size={96} palette={palette} />
          {(state === 'processing' || state === 'capturing') && (
            <div style={{
              position: 'absolute', inset: -6, borderRadius: '50%',
              border: `2px dashed ${SUSU.accent}`,
              animation: 'susu-spin 6s linear infinite', pointerEvents: 'none',
            }} />
          )}
        </div>
      </div>

      {libraryOpen && (
        <div style={{
          position: 'absolute', inset: 0, background: 'rgba(58,42,36,0.25)',
          display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 30,
        }} onClick={() => setLibraryOpen(false)}>
          <div onClick={(e) => e.stopPropagation()}>
            <TimelineWindow style={{ width: 860, height: 580 }} />
          </div>
        </div>
      )}

      <style>{`@keyframes susu-spin { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }`}</style>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Tweakable defaults
// ─────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = {
  palette: 'lilac',
  buddySize: 96,
};

// ─────────────────────────────────────────────────────────────
// Mood grid
// ─────────────────────────────────────────────────────────────
const MOOD_NOTES = {

  blink: { label: 'blink', sub: 'a quiet hello every few seconds', bg: '#FFFDF9' },
  sleepy: { label: 'sleepy', sub: 'after 5 min of inactivity', bg: '#F3EDE0' },
  happy: { label: 'happy', sub: 'you hovered · nice to see you', bg: '#FFF1E2' },

function MoodStrip({ palette }) {

// ─────────────────────────────────────────────────────────────
// Palette swatches
// ─────────────────────────────────────────────────────────────
function PaletteCard({ name, pal }) {

function PaletteStrip() {
  const names = Object.keys(MOCHI_PALETTES);

      display: 'flex', flexDirection: 'column' }}>

        <div style={{ fontSize: 22, fontWeight: 800, color: '#3A2A24' }}>species / fur colorway</div>
        <div style={{ fontSize: 13.5, color: '#6B5147' }}>same geometry, different warm-pastel hue family. all within oklch(~0.86, ~0.08)</div>
      </div>

// ─────────────────────────────────────────────────────────────
// Capture-flow storyboard (5 frames)
// ─────────────────────────────────────────────────────────────
function FlowFrame({ n, label, children, w = 400, h = 300 }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
        <span style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 11, color: '#9E867A', fontWeight: 700 }}>
          {String(n).padStart(2,'0')}
        </span>
        <span style={{ fontSize: 13, fontWeight: 700, color: '#3A2A24' }}>{label}</span>
      </div>
      <div style={{ width: w, height: h, background: '#fff', borderRadius: 10,
        border: '1px solid rgba(74,58,50,0.10)', overflow: 'hidden', position: 'relative',
        boxShadow: '0 2px 8px rgba(74,58,50,0.08)' }}>
        {children}
      </div>
    </div>
  );
}

function MiniDesktop({ palette, state }) {

    <div style={{ position: 'absolute', inset: 0, overflow: 'hidden' }}>
      <DesktopBg />
      <div style={{ position: 'absolute', top: 20, left: 40, right: 40, bottom: 60,

        <div style={{ position: 'absolute', right: 20, bottom: 80, width: 140,
          background: '#FFFDF9', borderRadius: 10, padding: '8px 10px',

          <div style={{ height: 3, background: '#F5EADA', borderRadius: 2, overflow: 'hidden' }}>

      </div>

        <FlowFrame n={4} label="buddy reads it">

        </FlowFrame>
        <FlowFrame n={5} label="markdown ready">
          <MiniDesktop palette={palette} state="done" />
        </FlowFrame>
      </div>

}

// ─────────────────────────────────────────────────────────────
// Inspiration flow (3 frames)
// ─────────────────────────────────────────────────────────────

  const moods = { empty: 'idle', writing: 'excited', saved: 'happy' };
  return (
    <div style={{ position: 'absolute', inset: 0, background: '#FDF6EE' }}>
      <DesktopBg />
      <div style={{ position: 'absolute', right: 16, bottom: 20, display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 8 }}>
        {stage === 'empty' && (
          <div style={{ background: '#FFFDF9', borderRadius: 12, padding: '8px 10px', border: '1px solid rgba(74,58,50,0.10)', width: 220,

            <div style={{ fontSize: 10, color: '#9E867A', fontFamily: 'JetBrains Mono, monospace', marginBottom: 4 }}>
              💭 a little thought…
            </div>
            <div style={{ fontSize: 11, color: '#9E867A', fontStyle: 'italic' }}>what's on your mind?</div>
          </div>
        )}
        {stage === 'writing' && (
          <div style={{ background: '#FFFDF9', borderRadius: 12, padding: '8px 10px', border: '1px solid rgba(74,58,50,0.10)', width: 240,

            <div style={{ fontSize: 10, color: '#9E867A', marginBottom: 4, display: 'flex', justifyContent: 'space-between' }}>
              <span>💭 a little thought</span><span style={{ fontFamily: 'JetBrains Mono, monospace' }}>14:22</span>
            </div>

              <span style={{ fontSize: 9, fontWeight: 700, background: '#FFE3D0', color: '#E8916B', padding: '1px 6px', borderRadius: 6 }}>#idea</span>

function InspirationFlow({ palette }) {
  return (
    <div style={{ width: 1360, height: 500, padding: '32px 40px', background: '#F9F2E5',
      display: 'flex', flexDirection: 'column' }}>
      <div style={{ marginBottom: 18 }}>
        <div style={{ fontSize: 22, fontWeight: 800, color: '#3A2A24' }}>inspiration · speech-bubble panel</div>
        <div style={{ fontSize: 13.5, color: '#6B5147' }}>⌘⇧N, or right-click the buddy. pops like a thought bubble; vanishes when you're done.</div>
      </div>
      <div style={{ display: 'flex', gap: 20 }}>
        <FlowFrame n={1} label="empty — waiting" w={380} h={340}>
          <MiniInspiration palette={palette} stage="empty" />
        </FlowFrame>
        <FlowFrame n={2} label="writing" w={380} h={340}>
          <MiniInspiration palette={palette} stage="writing" />
        </FlowFrame>
        <FlowFrame n={3} label="saved · timestamped" w={380} h={340}>
          <MiniInspiration palette={palette} stage="saved" />
        </FlowFrame>

// ─────────────────────────────────────────────────────────────
// Tweaks panel
// ─────────────────────────────────────────────────────────────
function TweaksPanel({ tweaks, setTweaks, visible }) {
  if (!visible) return null;
  return (
    <div style={{
      position: 'fixed', right: 20, bottom: 20, zIndex: 1000,
      background: '#FFFDF9', borderRadius: 16,
      boxShadow: '0 12px 36px rgba(74,58,50,0.22)',
      border: '1px solid rgba(74,58,50,0.12)',
      padding: 14, width: 260, fontFamily: 'Nunito, sans-serif', color: '#3A2A24',
    }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
        <div style={{ fontSize: 14, fontWeight: 800 }}>Tweaks</div>
        <Mochi mood={tweaks.palette === 'lilac' ? 'excited' : 'happy'} palette={tweaks.palette} size={34} />
      </div>
      <div style={{ fontSize: 11, color: '#9E867A', marginBottom: 10 }}>buddy appearance</div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 6, marginBottom: 14 }}>
        {Object.keys(MOCHI_PALETTES).map((p) => (
          <button key={p} onClick={() => setTweaks({ ...tweaks, palette: p })}
            style={{
              padding: 0, border: `2px solid ${tweaks.palette === p ? '#E8916B' : 'transparent'}`,
              borderRadius: 10, cursor: 'pointer', background: 'transparent',
            }}>
            <div style={{
              width: '100%', aspectRatio: '1', borderRadius: 8,
              background: `radial-gradient(circle at 40% 35%, ${MOCHI_PALETTES[p].highlight}, ${MOCHI_PALETTES[p].body} 60%, ${MOCHI_PALETTES[p].bodyDeep})`,
            }} />
            <div style={{ fontSize: 9.5, color: '#6B5147', fontWeight: 700, marginTop: 3 }}>{p}</div>
          </button>
        ))}
      </div>
      <div style={{ fontSize: 11, color: '#9E867A', marginBottom: 6 }}>buddy size · {tweaks.buddySize}px</div>
      <input type="range" min="64" max="140" step="4" value={tweaks.buddySize}
        onChange={(e) => setTweaks({ ...tweaks, buddySize: Number(e.target.value) })}
        style={{ width: '100%', accentColor: '#E8916B' }} />
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// App
// ─────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [editMode, setEditMode] = React.useState(false);

  React.useEffect(() => {
    const onKey = (e) => {
      // Cmd/Ctrl + . toggles the tweaks panel
      if ((e.metaKey || e.ctrlKey) && e.key === '.') {
        e.preventDefault();
        setEditMode((v) => !v);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  return (
    <>
      <DesignCanvas>
        <DCSection id="buddy" title="The buddy" subtitle="A limbless mochi blob with eight expressions. Pure SVG, auto-blinks on idle.">
          <DCArtboard id="moods" label="moods × 8" width={1840} height={620}>
            <MoodStrip palette={tweaks.palette} />
          </DCArtboard>
          <DCArtboard id="palettes" label="colorways" width={1320} height={500}>
            <PaletteStrip />
          </DCArtboard>
        </DCSection>

        <DCSection id="prototype" title="Live prototype" subtitle="Click the buddy (bottom-right). Try capture, quick thought, archive.">
          <DCArtboard id="live" label="click the buddy ↘" width={1280} height={800}>
            <PrototypeScene palette={tweaks.palette} width={1280} height={800} />
          </DCArtboard>
        </DCSection>

        <DCSection id="capture" title="Capture flow" subtitle="How a chunk of screen becomes a tidy markdown note.">
          <DCArtboard id="capture-story" label="storyboard · 5 frames" width={2180} height={500}>
            <CaptureFlow palette={tweaks.palette} />
          </DCArtboard>
        </DCSection>

        <DCSection id="inspiration" title="Inspiration speech-bubble" subtitle="Minimal, pops from the buddy, auto-timestamped.">
          <DCArtboard id="insp-story" label="storyboard · 3 frames" width={1360} height={500}>
            <InspirationFlow palette={tweaks.palette} />
          </DCArtboard>
        </DCSection>

        <DCSection id="library" title="Timeline archive" subtitle="Captures and ideas live together, grouped by day.">
          <DCArtboard id="archive" label="timeline · unified feed" width={960} height={640}>
            <div style={{ padding: 28, background: '#F9F2E5', width: '100%', height: '100%' }}>
              <TimelineWindow style={{ width: '100%', height: '100%' }} />
            </div>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={editMode} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
